# AFRd2: Android 11-14, ядро 5.x (S905X5M и подобные)

enable=1
log.file=/data/local/afrd.log
log.enable=1

# триггер
trigger.poll.ms=300
trigger.start.debounce.ms=500
trigger.stop.debounce.ms=1500

# определение частоты
# Наблюдение перед решением: счётчик кадров завышен односторонне (плеер
# повторно декодирует кадры на границах DASH/HLS-сегментов, AV1-тракт
# добавляет свои), поэтому частота берётся по НИЖНЕЙ ОГИБАЮЩЕЙ подокон:
# минимум из частот подокон длиной sub.ms. Живой замер 01.10 (13 роликов
# YouTube): решение по одному окну верно для 24-фпс роликов в 14 % случаев,
# огибающая за 20 с — в 86 %, для 25-фпс — 100 %; ошибки только в сторону
# 25 Гц (пропуск кадра заметнее повтора).
#
# Цена: режим переключается не раньше чем через skip.ms + envelope.ms после
# старта видео (было 1.5-6 с). Видео короче этого — просто не переключается.
fps.measure.envelope.ms=20000
# Раннее решение: не ждать полного наблюдения, если два разнесённых подокна
# согласны по классу (кворум). Понятный контент переключается раньше, а
# пограничный (24/25 fps) ждёт полного наблюдения, как раньше. 0 — выключено.
fps.measure.envelope.early.ms=14000
# Предел наблюдения, если окна неоднозначны (доверительный интервал ±1 кадр
# не укладывается в одну группу частот). Меньше envelope.ms — не бывает.
# Горизонт ограничен ёмкостью кольца наблюдения (128 выборок, то есть
# ~127 × trigger.poll.ms): при превышении демон пишет об этом в лог и урезает
# значение — больше данных всё равно не накопить.
fps.measure.envelope.max.ms=30000
# Длина подокна. 5 с — компромисс: за 5 с ±1 кадр даёт ±0.2 fps (для 24 fps).
fps.measure.envelope.sub.ms=5000
# Прогрев: подокна, начинающиеся раньше, не рассматриваются. Набор буфера
# у некоторых плееров занижает первые секунды (60-фпс канал через VLC давал
# по первому окну 50.3 fps), а минимум чувствителен к провалу.
fps.measure.envelope.skip.ms=2000
fps.measure.retries=3
# Уточнение решения заявленной длительностью кадра (vdec_status: frame dur), %:
# на живых IPTV счётчик кадров завышен на 2–4% (плеер повторно декодирует кадры
# на границах HLS-сегментов), поэтому решение уточняется заявленной частотой,
# если она рядом с замером. 0 — уточнение выключено.
fps.declared.crosscheck.pct=5
# Перепроверка замера: через столько мс после переключения демон мерит частоту
# ещё раз и меняет режим, только если класс однозначно другой (первое окно у
# некоторых плееров смещено набором буфера: 60-фпс канал давал 50.3 → 50 Гц).
# 0 — выключено. Знание о конкретном плеере не требуется.
# Живой замер 01.10 (SmartTube): 25-фпс ролик на старте был принят за 23.3 fps и
# 8 с держался в 24 Гц, пока перепроверка не поправила. 4000 мс уменьшают это
# окно ошибки вдвое; окно замера после перепроверки заканчивается позже стартового
# «недобора» плеера, так что раньше него опускаться не стоит.
fps.recheck.delay.ms=4000
# Проверка подачи после смены режима: через столько мс демон смотрит интервалы
# подачи видео-слоя (dumpsys SurfaceFlinger --latency). Если подача вдвое реже
# периода дисплея (видео «как 13 fps» — HWC/SF не перенастроили vsync-путь), демон
# переключает режим «туда-обратно» (до 2 раз на видео). Повторная выдача того же
# режима не помогает — проверено на стенде (журнал §21.9). 0 — выключено.
fps.cadence.fix.ms=2500
fps.prefer.api=1
#mode.blacklist.rates=29.97

# Плееры, которым AFR мешает: демон их мерит и пишет в журнал, но режим не
# переключает и не удерживает. Нужно плеерам, которые выбирают темп отрисовки в
# момент старта ролика по текущему режиму экрана (min(частота ролика, частота
# экрана)) и потом его не поднимают: при листании роликов удержанный низкий
# режим «зажимал» следующий ролик — проверено живьём на штатном YouTube TV
# (60-фпс ролик после 25- или 50-фпс играл 50 к/с и сам не восстанавливался).
#
# Умолчания нет ни на одном пути: список пуст. Раньше на Android 10/11 в нём
# был штатный YouTube — считалось, что зажим там не снять иначе как запретом
# (журнал §48.10). Живой замер на `.42` это опроверг: сброс потолка перезапуском
# кодека снимает зажим за 0.26 с и сохраняет позицию ролика (§64.7).
# Чтобы добавить плеер, перечислите пакеты через пробел; пустое значение —
# «исключений нет».
#switch.skip.pkg=com.youtube.another.client

# Минимальная частота режима для конкретных плееров: «<пакет>=<Гц>». Ниже неё
# демон режимы не выбирает: если для частоты контента есть ровное кратное выше
# порога — берётся оно (25 → 50), иначе самый быстрый доступный режим (24 → 60).
# Инструмент для плееров, которые «зажимают» темп, но которых всё же стоит
# переключать; для плееров из switch.skip.pkg он не нужен (там режим не трогают).
#mode.min.hz.list=com.example.player=50

# Калибровка частоты (по умолчанию ВКЛЮЧЕНА — решение владельца 01.10: работает
# кодековая поправка AV1 ниже; список поправок по плеерам по умолчанию пуст).
# Некоторые плееры подают кадры в декодер чаще номинала: на живом стенде
# приложение YouTube на 24-фпс ролике давало по счётчику ~25.2 fps (+5%), и
# режим уходил в 25 Гц вместо 24 (граница класса 24 -> 25 лежит на 24.49).
# Значение — на сколько процентов плеер завышает частоту: "<пакет>=<проценты>"
# через пробел. Замер делится на (1 + проценты/100) до классификации.
# Измерять так: включить демон с логом, дать видео 30-60 с, взять из лога
# строку "видео: <HZ> Гц по огибающей (N с наблюдения, горизонт M мс), ищу
# режим", сравнить с номиналом (например, stats for nerds).
# ВАЖНО: значение подбирается по факту — если оно меньше реального завышения,
# доверительный интервал окна может так и не уложиться в одну группу частот,
# и демон напишет "частоту определить не удалось" (режим не переключится).
# Признак верного значения — строка "плеер <пакет>: поправка замера ±P %
# (fps.correct.list)".
# На стенде для YouTube (24-фпс AV1 ролик) сработало 5.0 (замер 25.2 -> 24.0).
fps.correct.enable=1
fps.correct.list=
# Поправка на завышение счётчика AV1-трактом декодера (аддитивная, кадр/с).
# Действует только при fps.correct.enable=1 и только когда `device name` из
# vdec_status содержит `av1`; при 0 не применяется и в лог не пишется.
# Измерено 01.10 в стороннем плеере (Just Player, один и тот же файл
# Sintel 24.000 fps): H.264 — 24.002, AV1 — 24.520 (+0.5 кадра/с); штатный
# клиент YouTube добавляет к этому своё (до +1.05).
# Правило выбора (решение владельца, подтверждено визуальным A/B 02.10):
# ошибка «24 fps определён как 25 Гц» смотрится заметно лучше обратной
# («25 fps определён как 24 Гц»). Поправка всегда сдвигает замер ВНИЗ, поэтому
# значение подобрано так, чтобы не потерять ни одного 25-фпс ролика.
# Подбор по живым записям (13 роликов YouTube; статистика — как у демона,
# нижняя огибающая; «24 верно / 25 верно / 25->24 запретных»):
#   0.0 -> 5/7  6/6  0        0.3 -> 6/7  5/6  1 (z7do1hhb6fE)
#   0.1 -> 6/7  6/6  0        0.5 -> 7/7  4/6  2
#   0.2 -> 6/7  6/6  0        1.0 -> 7/7  3/6  3
# То есть 0.1–0.2 — единственная зона, где 25-фпс остаются 100 %, а 24-фпс
# угадываются на один ролик лучше, чем без поправки. Выбрано 0.1: результат тот
# же, но запас до запретной стороны вдвое больше (ближайший 25-фпс ролик стоит
# на 0.28 fps выше границы класса, до неё остаётся 0.175 fps).
# Гарантии «100 %» нет ни у какого значения: на контрольной выборке из 65
# роликов два честных 25-фпс ролика измерились ниже границы класса и без
# поправки (огибающая смещена вниз), а разброс внутри одного воспроизведения
# доходит до ±0.5 fps. Менять — осознанно, сверяя с логом.
fps.correct.av1.offset=0.1
# Относительная поправка AV1 (проценты). На Android 10/11 (X4, ядро 5.4) завышение
# AV1-тракта оказалось ПРОПОРЦИОНАЛЬНЫМ частоте: живой замер 18.10 —
# 23.976 -> 25.40 (+5.9 %), 59.94 -> 63.30 (+5.6 %). Аддитивная поправка выше такое
# не лечит (на 24 fps нужно -1.4 кадра/с, на 60 fps — -3.4), а эта работает одной
# величиной. Применяется только к AV1-декодеру и делит измеренную частоту.
# 0 — выключено (умолчание). Значение подбирается по логу: 5.7 даёт 23.98 и 59.9.
#fps.correct.av1.pct=5.7
# Ограничить поправку одним плеером (пусто — любой). Имя пакета в логе видно
# строкой «плеер <пакет>: поправка замера ...», но она печатается только при
# непустом fps.correct.list; иначе пакет нигде не логируется.
fps.correct.av1.pkg=

# выбор режима
mode.prefer.exact=0
mode.use.fract=1

# переключение
# (switch.delay.on/retry, switch.blackout, switch.ignore, switch.hdmi на этом
#  пути не действуют: режим переключает фреймворк транзакцией SurfaceFlinger 1035,
#  затемнения нет. Ключи оставлены только в legacy-профилях. Исключение —
#  switch.delay.off: здесь он задаёт предел терпения к паузе, см. ниже.)
switch.restore.on.stop=1
pause.keep=1
# Предел удержания режима на паузе («терпение к паузе»). 0 — держать режим до
# конца паузы (как было до этой версии). N>0 — пауза дольше N мс считается
# концом видео: исходный режим возвращается, а на возобновлении удержанный
# режим возвращается сразу, без нового замера.
# Почему так: на этом пути нет события «видео кончилось» — остановленное видео
# с плеером на экране неотличимо от паузы (живой замер, журнал §32.1). Поэтому
# тот же ключ, что на Android 6-9 откладывает возврат после остановки, здесь
# задаёт терпение к паузе.
switch.delay.off=0

# Вендорный путь смены режима (Android 10/11, Amlogic). На этих версиях
# транзакция SurfaceFlinger 1035 означает другую операцию, но режим переключает
# вендорный SystemControl HAL — им пользуется штатный системный AFR. Помощник
# (app_process + dex) раскладывают приложение и Magisk-модуль, поэтому путь
# настраиваемый; список режимов ТВ читается из disp_cap (таблицы SF там нет).
vendor.disp.cli=/data/local/tmp/afrd-disp.sh
vendor.disp.cap=/sys/class/amhdmitx/amhdmitx0/disp_cap

# Быстрое решение по заявленной частоте кадра (vdec_status: frame rate): 1 —
# применить режим сразу по заявленной частоте (так делает системный AFR,
# поэтому он и переключает за 2–4 с) и затем проверить замером; при расхождении
# режим правится (fps.recheck.delay.ms). 0 — решать только по замеру.
# Ключ НЕ задан намеренно — умолчание зависит от пути: на Android 10/11
# включено (как решает штатный системный AFR), на ATV14 выключено (путь проверен
# живьём, а быстрое решение меняет поведение — включается осознанно). Заданный
# здесь ключ перебил бы это умолчание, поэтому пишем только подсказку.
#fps.declare.fast=0

# Плееры, которым применяются механики зажима — подъём режима (switch.bump)
# и сброс потолка (switch.ceiling.reset). Список пакетов через пробел.
# Зажим измерен только у штатного YouTube (журнал §28.9, §46.6, §47.2), а у
# остальных плееров он не подтверждён и механики могут мешать: запасной способ
# сброса — смена конфигурации экрана, и часть плееров на ней перезапускает
# Activity (живой случай: OTT Navigator возвращался к предыдущему каналу при
# первом срабатывании AFR). Поэтому по умолчанию список — только штатный YouTube.
# Пустое значение (switch.bump.pkg=) — механики не применяются никому.
# Ключ НЕ задан намеренно: умолчание — com.google.android.youtube.tv.
# На старом пути (Android 6-9) ключ не действует.
#switch.bump.pkg=com.google.android.youtube.tv

# Подъём режима до максимальной частоты ТВ при старте видео (Android 11+).
# Плеер фиксирует «потолок» частоты в начале сессии проигрывания: если в этот
# момент дисплей медленнее контента, темп не поднимется уже никогда, и решение
# по огибающей (fps.measure.envelope.ms) приходит слишком поздно — картинка
# остаётся зажатой (журнал §47.6). С 1 демон сразу поднимает режим до самой
# высокой частоты, поддержанной ТВ, а затем обычный замер опускает его до
# нужной (вниз плеер следует сам). Цена — один лишний переход режима для
# контента не на максимальной частоте. 0 — только по замеру (прежнее поведение).
# Применяется только плеерам из switch.bump.pkg.
# На старом пути (Android 6-9) ключ не действует. Умолчание — 1.
#switch.bump=1

# Поднимать режим, когда на передний план выходит новый пакет (обычно плеер).
# Плеер на Android 11+ запоминает частоту дисплея в момент создания поверхности,
# а канал декодера появляется позже (замер: поверхность на 1.1 с, декодер на 3.9 с
# от старта ролика). Поэтому на Android 10/11 подъём «по видео» опаздывает, а
# передний план виден уже на 0.3-0.5 с. Опрос переднего плана стоит 60-70 мс,
# поэтому выполняется только когда он может что-то изменить: видео не идёт,
# режим ниже максимума, и не чаще раза в секунду. Применяется только плеерам
# из switch.bump.pkg. 1 — включён (умолчание),
# 0 — выключен (тогда подъём только по старту видео).
#switch.bump.on.app=1

# Сброс «потолка» частоты у плеера (Android 10-14). Плеер запоминает частоту
# дисплея в начале сессии проигрывания и внешнюю смену режима не перечитывает:
# ролик, начатый под 50 Гц, после подъёма до 60 остаётся зажатым (~50 к/с).
# Потолок обновляется перезапуском декодера (switch.ceiling.method), поэтому
# подача выправляется с текущей позиции ролика.
# Замеры: ATV14 — подача 50.34 -> 60.00 к/с (журнал §47.9), цена 0.25 с (§67);
# ATV11 — 50.02 -> 59.94 к/с за 0.26 с (§64.7).
# Сброс делается один раз на видео, отложенно (4 с после решения о режиме) и
# только когда зажим возможен: целевой режим выше того, под которым началось
# видео. Механизм не зависит от switch.bump — при выключенном подъёме он
# остаётся единственной защитой от зажима (проверено §67 на `.50`).
# Ключ НЕ задан намеренно: умолчание следует за switch.bump (на обоих путях).
#switch.ceiling.reset=1

# Чем сбрасывать потолок (журнал §60):
#   auto    — перезапуск процесса кодека, при отказе смена плотности (умолчание);
#   codec   — только перезапуск кодека;
#   density — только смена плотности (прежнее поведение).
# Перезапуск кодека пересоздаёт сессию декодера у плеера: тот перечитывает
# режим и подача выправляется с ТЕКУЩЕЙ позиции ролика. Замер на ATV14:
# декодер пропадает на 68 мс и возвращается на 1.1 с; смена плотности —
# 6.8 с, плюс пересоздание Activity. Цена: перезапускается HAL, то есть
# декодер у всех приложений сразу (на ТВ-боксе с одним видео на экране это
# не заметно; фоновое воспроизведение в другом приложении прервётся).
#switch.ceiling.method=auto

# Постоянный помощник смены режима (Android 10/11). Разовый запуск app_process
# стоит ~490 мс, то есть примерно столько же, сколько сам HAL на быстром ТВ;
# помощник держит VM и классы HIDL загруженными и принимает имена режимов
# построчно (замер: тот же режим 20 мс, смена 360-1090 мс вместо 850-1760 мс).
# Любой его отказ — демон возвращается к разовому запуску, поэтому ключ можно
# выключать без потери работоспособности. 1 — включён (умолчание), 0 — выкл.
#vendor.disp.persist=1

# Цветовое пространство. sysfs-узел attr на ядрах 5.x пишется с ошибкой
# (проверено), поэтому значение применяется вендорским сервисом
# (/vendor/bin/meson_display_client -s "HDMI Color ATTR" <значение>), а
# правила cs.select сопоставляются с именем режима. По умолчанию правило одно —
# на 4K и частоте 40 Гц и выше нужен 420 (полосы HDMI не хватает на 444);
# остальные режимы не трогаются, чтобы не спорить с выбором системы и плеера.
# Пример «жёсткой» настройки (вернуть 444 для всего, что не 4K): добавить " .*=444".
# Список запрещённых/разрешённых форматов берётся из dc_cap телевизора.
cs.list.path=/sys/class/amhdmitx/amhdmitx0/dc_cap
cs.path=/sys/class/amhdmitx/amhdmitx0/attr
cs.select=2160p[4-9].*=420

# Пути sysfs (vdec_status, состояние HDMI) задаются автодетектом окружения
# (platform_detect); в конфиге они не переопределяются.
