apply plugin: 'com.android.application'

// Подпись релиза. Путь к хранилищу и пароли берутся из android/app/keystore.properties
// (файл в .gitignore — в репозитории его нет; сам keystore тоже не коммитится).
// Без файла остаются значения-заглушки из upstream: сборка debug работает,
// release подписать нечем — сборка релиза требует своих ключей.
def keystoreProps = new Properties ()
def keystorePropsFile = file ('keystore.properties')
if (keystorePropsFile.exists ()) {
    keystorePropsFile.withInputStream { keystoreProps.load (it) }
}

android {
    compileSdkVersion 27
    defaultConfig {
        applicationId 'ru.reyter.afrd2'
        minSdkVersion 23
        compileSdkVersion 27
        versionCode 303
        versionName '0.3.3'
        targetSdkVersion 28
        versionNameSuffix ''
        project.ext.set ('archivesBaseName', "${applicationId}-${versionName}${versionNameSuffix}".toString ())
    }
    signingConfigs {
        zap {
            storeFile file (keystoreProps.getProperty ('storeFile', 'zap.jks'))
            keyAlias keystoreProps.getProperty ('keyAlias', 'key0')
            storePassword keystoreProps.getProperty ('storePassword', '123456')
            keyPassword keystoreProps.getProperty ('keyPassword', '654321')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.zap
        }
        debug {
        }
    }
    buildToolsVersion '28.0.3'
    productFlavors {
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

android {
    tasks.withType(JavaCompile) {
        configure(options) {
            options.encoding = 'UTF-8'
            options.debug = true
            options.failOnError = true
            options.warnings = true
            options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
        }
    }
}